item.rbmk-white-reactor-uranium-pellets.name = Enriched Fuel Pellets
item.rbmk-white-reactor-uranium-pellets.description = Ceramic fuel pellets from a gameplay fuel process. The recipe is for Mindustry balance, not real nuclear-fuel manufacturing.
item.rbmk-white-reactor-zirconium-cladding.name = Zirconium Cladding
item.rbmk-white-reactor-zirconium-cladding.description = Heat-resistant, low-absorption cladding used to seal fuel pellets.
item.rbmk-white-reactor-uranium-assembly.name = Uranium Fuel Assembly
item.rbmk-white-reactor-uranium-assembly.description = Reactor fuel assembled from pellets, cladding and graphite structural parts.
liquid.rbmk-white-reactor-demineralized-water.name = Demineralized Light Water
liquid.rbmk-white-reactor-demineralized-water.description = Polished primary-loop feedwater used for channel cooling, boiling and steam production.
block.rbmk-white-reactor-pellet-plant.name = Nuclear Fuel Pellet Plant
block.rbmk-white-reactor-pellet-plant.description = Processes vanilla thorium and silicon into mod fuel pellets. This is a gameplay recipe that keeps the chain obtainable on vanilla maps.
block.rbmk-white-reactor-cladding-mill.name = Cladding Rolling Mill
block.rbmk-white-reactor-cladding-mill.description = Produces zirconium-style fuel cladding from titanium and metaglass.
block.rbmk-white-reactor-fuel-assembly-plant.name = Fuel Assembly Plant
block.rbmk-white-reactor-fuel-assembly-plant.description = Combines pellets, cladding and graphite into uranium fuel assemblies consumed by the reactor.
block.rbmk-white-reactor-water-treatment.name = Demineralized Water Plant
block.rbmk-white-reactor-water-treatment.description = Uses vanilla water and power to continuously output reactor-grade demineralized water.
block.rbmk-white-reactor-rbmk-plant.name = White RBMK Power Station Mk.II
block.rbmk-white-reactor-rbmk-plant.description = High-output white software-3D station with a complete supply chain, guided mode and expert operation. Nominal output is five times v1; a stable expert configuration reaches ten times v1.
